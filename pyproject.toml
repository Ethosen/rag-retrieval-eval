[project]
name = "rag-retrieval-eval"
version = "0.1.0"
description = "Comparing BM25, dense, hybrid and reranked retrieval on the Open RAG Bench multimodal arXiv corpus"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "sentence-transformers>=3.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
